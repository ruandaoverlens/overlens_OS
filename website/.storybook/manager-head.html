<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin="anonymous"
/>
<link
  href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Outfit:wght@100..900&display=swap"
  rel="stylesheet"
/>
<style>
  /* DS sidebar icon colors — tokens from globals.css */
  [data-nodetype="component"] svg,
  [data-nodetype="document"] svg,
  [data-nodetype="story"] svg,
  [data-nodetype="group"] svg,
  /* Search results list icons */
  #storybook-explorer-menu svg,
  .search-result-item svg,
  [class*="search-result"] svg {
    color: oklch(0.928 0 0) !important;
  } /* surface-200 */

  /* ── Input sm search bar ── */
  div.search-field {
    background: rgba(255, 255, 255, 0.06) !important; /* bg-input/30 */
    border: 2px solid transparent !important;
    border-radius: 8px !important; /* sm: rounded-lg */
    padding: 0 10px !important;
    height: 40px !important; /* sm: h-10 */
    transition:
      border-color 0.2s,
      background 0.2s !important;
  }

  div.search-field:hover {
    background: rgba(255, 255, 255, 0.1) !important; /* hover:bg-input/50 */
  }

  div.search-field:has(input:focus),
  div.search-field:has(input:active) {
    border-color: rgba(255, 255, 255, 0.2) !important; /* focus:border-input */
    background: transparent !important;
  }

  input#storybook-explorer-searchfield {
    font-family: "Inter", sans-serif !important;
    font-size: 14px !important; /* sm: text-sm */
    font-weight: 400 !important;
    color: #fafafa !important;
  }

  input#storybook-explorer-searchfield::placeholder {
    color: rgba(255, 255, 255, 0.35) !important; /* text-muted-foreground */
  }

  /* Search icon */
  div.search-field > div:first-child svg {
    color: rgba(255, 255, 255, 0.35) !important;
    width: 20px !important;
    height: 20px !important;
  }

  /* Hide shortcut badge */
  div.search-field code {
    display: none !important;
  }

  /* ── Sidebar search + button row alignment ── */
  div.search-field + div,
  div:has(> div.search-field) {
    display: flex !important;
    align-items: center !important;
  }

  /* ── Button outline icon-only "+" ── */
  button[aria-label="Create a new story"] {
    width: 40px !important;
    height: 40px !important;
    border-radius: 9999px !important;
    background: transparent !important;
    color: #fafafa !important;
    border: 2px solid rgba(255, 255, 255, 0.12) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    transition:
      border-color 0.2s,
      color 0.15s !important;
    cursor: pointer !important;
    flex-shrink: 0 !important;
  }

  button[aria-label="Create a new story"]:hover {
    border-color: rgba(255, 255, 255, 0.4) !important;
  }

  button[aria-label="Create a new story"] svg {
    width: 20px !important;
    height: 20px !important;
    color: #fafafa !important;
  }

  /* ── Scrollbar — hidden but scrollable ── */
  ::-webkit-scrollbar {
    width: 0 !important;
    height: 0 !important;
    display: none !important;
  }

  * {
    scrollbar-width: none !important;
  }

  /* Global: focus outlines → atmos */
  button:focus-visible,
  a:focus-visible {
    outline-color: #8ec5d0 !important;
  }
</style>
<script>
  // Replace Storybook's hardcoded #66BF3C (color.positive) with atmos (#8ec5d0)
  // in emotion-injected <style> tags.
  (function () {
    var ATMOS = "#8ec5d0";
    var GREEN = /#66BF3C/gi;

    function patchStyles() {
      document.querySelectorAll("style[data-emotion]").forEach(function (el) {
        if (GREEN.test(el.textContent)) {
          el.textContent = el.textContent.replace(GREEN, ATMOS);
        }
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", patchStyles);
    } else {
      patchStyles();
    }

    var observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (m) {
        m.addedNodes.forEach(function (node) {
          if (node.tagName === "STYLE" && node.dataset.emotion !== undefined) {
            if (GREEN.test(node.textContent)) {
              node.textContent = node.textContent.replace(GREEN, ATMOS);
            }
          }
        });
      });
    });
    observer.observe(document.head, { childList: true });
  })();

  // Replace Storybook's default favicon with a triangle in atmos
  (function () {
    var TRIANGLE_SVG =
      "data:image/svg+xml," +
      encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
          '<polygon points="16,4 28,28 4,28" fill="#8ec5d0"/>' +
          "</svg>",
      );

    function setFavicon() {
      // Remove all existing favicons
      document.querySelectorAll('link[rel*="icon"]').forEach(function (el) {
        el.remove();
      });
      var link = document.createElement("link");
      link.rel = "icon";
      link.type = "image/svg+xml";
      link.href = TRIANGLE_SVG;
      document.head.appendChild(link);
    }

    // Run after DOM is ready and also watch for Storybook re-injecting its favicon
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(setFavicon, 100);
      });
    } else {
      setTimeout(setFavicon, 100);
    }

    var faviconObserver = new MutationObserver(function (mutations) {
      mutations.forEach(function (m) {
        m.addedNodes.forEach(function (node) {
          if (
            node.tagName === "LINK" &&
            node.rel &&
            node.rel.includes("icon") &&
            !node.href.includes("data:image/svg+xml")
          ) {
            setTimeout(setFavicon, 0);
          }
        });
      });
    });
    faviconObserver.observe(document.head, { childList: true });
  })();
</script>
